<div class="flex justify-between items-center">
  <h2 class="text-xl text-primary">{{ title() }}</h2>

  <div class="flex gap-4">
    @for (icon of icons; track icon.name) {
      <button class="
        cursor-pointer
        bg-muted
        rounded-md
        p-2
        flex
        items-center
        justify-center
        text-primary
        hover:bg-primary
        hover:text-muted
        transition-all
        duration-400"
      >
        <ng-icon name="{{ icon.name }}" size="{{ icon.size }}"></ng-icon>
      </button>
    }

    <div class="relative">
      <button
        type="button"
        class="anchor flex items-center gap-2 bg-muted rounded-md py-1 pr-10 pl-4"
        pRipple
        (click)="opened.set(!opened())"
      >
        <span class="text-base text-primary">{{ userName() }}</span>

        <p-avatar
          [image]="userAvatar()"
          size="normal"
          shape="circle"
          class="avatar"
        />

        <button class="text-primary transition-transform duration-400 absolute right-2 flex items-center justify-center" [ngClass]="{ 'rotate-180': opened() }">
          <ng-icon name="heroChevronDown" size="20"></ng-icon>
        </button>
      </button>

      <div
        [ngClass]="{ 'opacity-0 pointer-events-none': !opened() }"
        class="shadow-md absolute top-[50px] w-1/2 right-0 bg-muted rounded-md transition-all duration-200"
      >
        <button class="cursor-pointer w-full p-2 text-left text-primary flex items-center gap-2 rounded-md hover:bg-primary hover:text-muted" (click)="logout()">
          <ng-icon name="heroArrowRightOnRectangle" size="20"></ng-icon>
          Sair
        </button>
      </div>
    </div>
  </div>
</div>
