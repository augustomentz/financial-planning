<div class="grid gap-4 bg-white shadow rounded-xl p-4">
  <div class="grid grid-cols-3 gap-4">
    <app-box classList="text-center">
      <h1 class="text-primary text-2xl font-bold mb-4">Entradas +</h1>
      <p class="text-green-400 text-[40px] font-bold">{{ entry() | currency: 'BRL' }}</p>
    </app-box>

    <app-box classList="text-center">
      <h1 class="text-primary text-2xl font-bold mb-4">Saídas -</h1>
      <p class="text-red-400 text-[40px] font-bold">{{ withdrawal() | currency: 'BRL' }}</p>
    </app-box>

    <app-box classList="text-center">
      <h1 class="text-primary text-2xl font-bold mb-4">Total $</h1>
      <p class="text-black text-[40px] font-bold" [ngClass]="{'text-red': total() < 0, 'text-green-400': total() > 0}">{{ total() | currency: 'BRL' }}</p>
    </app-box>


  </div>

  <div class="grid grid-cols-4 gap-4">
    <p-floatlabel variant="on">
      <input pInputText id="on_label" autocomplete="off" class="w-full" />
      <label for="on_label">Descrição</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
        <p-inputNumber id="on_label" autocomplete="off" class="w-full" mode="currency" currency="BRL" locale="pt-BR"/>
        <label for="on_label">Valor</label>
    </p-floatlabel>

      <p-select [options]="transactionTypes()" optionLabel="label" placeholder="Tipo de transação" class="w-full" />

      <p-button type="button" label="Adicionar" [fluid]="true" />
  </div>

  <p-table [value]="transactions()">
    <ng-template #header>
        <tr>
            <th>Entradas +</th>
            <th>Saídas -</th>
            <th>Tipo</th>
        </tr>
    </ng-template>
    <ng-template #body let-transaction>
        <tr>
            <td>{{ transaction.entries | currency: 'BRL' }}</td>
            <td>{{ transaction.withdrawal | currency: 'BRL' }}</td>
            <td>{{ transaction.type | transaction }}</td>
        </tr>
    </ng-template>
</p-table>
</div>
