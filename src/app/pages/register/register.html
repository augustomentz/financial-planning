<div class="flex flex-col items-center justify-center h-dvh">
  <div class="p-4 bg-white rounded-lg shadow-md border-t-4 border-[#0F2A1D] min-w-[300px] text-center">
    <h1 class="text-2xl font-bold text-[#0F2A1D]">Financial Planning</h1>

    <div class="flex flex-col gap-2 my-5" [formGroup]="form">
      <input pInputText type="text" placeholder="Name" formControlName="name" />
      <input pInputText type="text" placeholder="Email" formControlName="email" />
      <input pInputText type="password" placeholder="Password" formControlName="password" />
    </div>

    <p-button type="button" label="Register" [fluid]="true" class="mt-4" [loading]="loading()" (onClick)="handleRegister()" />
    <a routerLink="/login" class="text-xs text-gray-500 underline cursor-pointer">Back to login</a>
  </div>
</div>

<p-toast />
